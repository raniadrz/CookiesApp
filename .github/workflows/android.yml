name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Validate seed overrides reference real cookies
        run: |
          python3 - <<'PY'
          import json, sys
          ids = {c["id"] for c in json.load(open("app/src/main/assets/seed/cookies.json"))["cookies"]}
          bad = [k for k in json.load(open("tools/overrides.json")) if not k.startswith("_") and k not in ids]
          if bad:
              sys.exit(f"overrides.json references unknown cookies: {bad}")
          print(f"{len(ids)} cookies, overrides OK")
          PY

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crumb-codex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
